<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>متجر أناقة للأزياء — بوابة المشتري ولوحة تحكم صاحب المتجر</title>

  <!-- خط Cairo العربي الحديث -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'system-ui', '-apple-system', 'sans-serif']
          }
        }
      }
    };
  </script>

  <style>
    body {
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      overflow-x: hidden;
      margin: 0;
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    html.dark body {
      background-color: #060913;
      color: #f8fafc;
    }

    /* خلفية متحركة غنية بالألوان وبنمط بطيء */
    .ambient-backdrop {
      position: fixed;
      inset: 0;
      z-index: -10;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(circle at 15% 15%, rgba(244, 63, 94, 0.12), transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(99, 102, 241, 0.11), transparent 45%),
        radial-gradient(circle at 50% 85%, rgba(245, 158, 11, 0.10), transparent 50%),
        linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      transition: background 0.4s ease;
    }

    html.dark .ambient-backdrop {
      background:
        radial-gradient(circle at 15% 15%, rgba(244, 63, 94, 0.18), transparent 46%),
        radial-gradient(circle at 85% 20%, rgba(99, 102, 241, 0.18), transparent 46%),
        radial-gradient(circle at 50% 85%, rgba(245, 158, 11, 0.12), transparent 50%),
        linear-gradient(180deg, #050811 0%, #0b1120 100%);
    }

    .ambient-orb {
      position: absolute;
      border-radius: 9999px;
      filter: blur(75px);
      will-change: transform, opacity;
    }

    .orb-rose {
      width: 380px;
      height: 380px;
      top: -80px;
      right: -60px;
      background: rgba(244, 63, 94, 0.22);
      animation: floatSlowOne 18s ease-in-out infinite alternate;
    }

    .orb-indigo {
      width: 360px;
      height: 360px;
      top: 40%;
      left: -80px;
      background: rgba(99, 102, 241, 0.20);
      animation: floatSlowTwo 22s ease-in-out infinite alternate;
    }

    .orb-amber {
      width: 340px;
      height: 340px;
      bottom: -100px;
      right: 25%;
      background: rgba(245, 158, 11, 0.18);
      animation: floatSlowOne 20s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatSlowOne {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(-45px, 40px, 0) scale(1.08); }
    }

    @keyframes floatSlowTwo {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(50px, -35px, 0) scale(1.07); }
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes cartPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.18) rotate(-4deg); }
      75% { transform: scale(0.95) rotate(2deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .animate-fade-up {
      animation: fadeSlideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .animate-cart-pop {
      animation: cartPop 0.45s ease;
    }

    .glass-bar {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      transition: background-color 0.35s ease, border-color 0.35s ease;
    }

    html.dark .glass-bar {
      background: rgba(15, 23, 42, 0.86);
    }

    .product-card {
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease;
    }

    .product-card:hover {
      transform: translateY(-6px);
    }

    .product-card:hover .product-img {
      transform: scale(1.06);
    }
  </style>
</head>
<body>
  <div class="ambient-backdrop" aria-hidden="true">
    <div class="ambient-orb orb-rose"></div>
    <div class="ambient-orb orb-indigo"></div>
    <div class="ambient-orb orb-amber"></div>
  </div>
  <div id="app" class="min-h-screen flex flex-col"></div>

  <script>
    // =========================================================================
    // التخزين المحلي ومزامنة الروابط (?view=shop / ?view=admin) + مؤثرات صوتية
    // =========================================================================
    const STORAGE_KEY = 'anaqa_fashion_store_v2';
    const THEME_KEY = 'anaqa_theme_mode_v1';

    // مولّد مؤثرات صوتية خفيفة عبر Web Audio API (بدون روابط خارجية)
    const SoundFX = {
      ctx: null,
      ensureCtx() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        return this.ctx;
      },
      playTone(freqs, durations, type = 'sine', gainVal = 0.08) {
        try {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          let startTime = ctx.currentTime;
          freqs.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.001, startTime);
            gain.gain.exponentialRampToValueAtTime(gainVal, startTime + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + durations[idx]);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + durations[idx] + 0.01);
            startTime += durations[idx] * 0.75;
          });
        } catch {}
      },
      addToCart() {
        this.playTone([523.25, 659.25, 783.99], [0.09, 0.09, 0.16], 'triangle', 0.09);
      },
      click() {
        this.playTone([440], [0.05], 'sine', 0.04);
      },
      success() {
        this.playTone([587.33, 880], [0.1, 0.22], 'sine', 0.08);
      },
      error() {
        this.playTone([220, 185], [0.12, 0.18], 'sawtooth', 0.05);
      }
    };

    function loadInitialState() {
      const viewMode = parseInitialView();
      let savedDark = false;
      try {
        savedDark = localStorage.getItem(THEME_KEY) === 'dark';
      } catch {}

      const base = {
        view: viewMode, // 'shop' | 'admin'
        darkMode: savedDark,
        cartBounce: false,
        products: DEFAULT_PRODUCTS,
        users: [], // { id, role: 'buyer'|'merchant', fullName, phone, whatsapp?, address?, email?, password, storeName? }
        currentBuyer: null,
        currentMerchant: null,
        cart: [], // { productId, size, qty }
        orders: [],
        // فلاتر واجهة المشتري
        selectedCategory: 'الكل',
        onlyOffersFilter: false,
        searchQuery: '',
        selectedSizesMap: {}, // productId -> chosenSize
        // حالة لوحة التاجر
        adminTab: 'products', // 'products' | 'offers' | 'orders'
        editingOfferProductId: null,
        uploadedImageDataUrl: '',
        // النوافذ المنبثقة
        modal: null, // null | { type: 'auth', role: 'buyer'|'merchant', mode: 'login'|'register', nextAction?: 'checkout' } | { type: 'cart' } | { type: 'checkout' } | { type: 'links' }
        authError: '',
        toast: null
      };

      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const hashProducts = decodeProductsFromHash();
        if (raw) {
          const saved = JSON.parse(raw);
          return {
            ...base,
            products: hashProducts || (Array.isArray(saved.products) && saved.products.length ? saved.products : DEFAULT_PRODUCTS),
            users: Array.isArray(saved.users) ? saved.users : [],
            currentBuyer: saved.currentBuyer || null,
            currentMerchant: saved.currentMerchant || null,
            cart: Array.isArray(saved.cart) ? saved.cart : [],
            orders: Array.isArray(saved.orders) ? saved.orders : []
          };
        }
        if (hashProducts) {
          return { ...base, products: hashProducts };
        }
      } catch (e) {
        console.error('خطأ في استرجاع بيانات المتجر:', e);
      }

      return base;
    }

    let state = loadInitialState();
    let toastTimer = null;

    function applyThemeClass() {
      if (state.darkMode) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }
    applyThemeClass();

    window.toggleDarkMode = function () {
      SoundFX.click();
      state.darkMode = !state.darkMode;
      applyThemeClass();
      try {
        localStorage.setItem(THEME_KEY, state.darkMode ? 'dark' : 'light');
      } catch {}
      render();
    };

    window.addToCart = function (productId) {
      const product = state.products.find((p) => p.id === productId);
      if (!product) return;
      const chosenSize = state.selectedSizesMap[productId] || (product.sizes && product.sizes[0]) || 'M';

      const existing = state.cart.find((item) => item.productId === productId && item.size === chosenSize);
      if (existing) {
        existing.qty += 1;
      } else {
        state.cart.push({ productId, size: chosenSize, qty: 1 });
      }
      saveState();
      render();
      showToast(`تمت إضافة «${product.name}» (مقاس ${chosenSize}) إلى السلة!`);
    };

    window.updateCartQty = function (index, delta) {
      const item = state.cart[index];
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) {
        state.cart.splice(index, 1);
      }
      saveState();
      render();
    };

    window.handlePlaceOrder = function (event) {
      event.preventDefault();
      if (!state.cart.length) return;

      const form = event.target;
    function showToast(text, type = 'success') {
      if (type === 'error') SoundFX.error();
      state.toast = { text, type };
      render();
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        state.toast = null;
        render();
      }, 3400);
    }

      const orderItems = state.cart
        .map((c) => {
          const prd = state.products.find((p) => p.id === c.productId);
          if (!prd) return null;
          const unitPrice = getEffectivePrice(prd);
          return {
            name: prd.name,
            size: c.size,
            qty: c.qty,
            unitPrice,
            subtotal: unitPrice * c.qty
          };
        })
        .filter(Boolean);

      const totalAmount = orderItems.reduce((sum, it) => sum + it.subtotal, 0);

      const newOrder = {
        id: 'ORD-' + Math.floor(10000 + Math.random() * 90000),
        customerName,
        customerPhone,
        address,
        notes,
        items: orderItems,
        totalAmount,
        status: 'قيد التجهيز',
        createdAt: new Date().toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' })
      };

      state.orders.unshift(newOrder);
      state.cart = [];
      state.modal = null;
      saveState();
      render();
      showToast(`تم تأكيد طلبك رقم ${newOrder.id} بنجاح! سيظهر فوراً في لوحة صاحب المتجر.`);
    };

    // =========================================================================
    // نظام إنشاء حساب وتسجيل دخول (للمشتري ولصاحب المتجر — كل واجهة مستقلة)
    // =========================================================================
    window.handleAuthSubmit = function (event) {
      event.preventDefault();
      const form = event.target;
      // تثبيت الدور حسب الواجهة الحالية: المشتري لا يمكنه التحويل للتاجر من واجهة المشتري
      const role = state.view === 'admin' ? 'merchant' : 'buyer';
      const mode = state.modal?.mode || 'login'; // 'login' | 'register'
      const nextAction = state.modal?.nextAction || null;

      if (mode === 'register') {
        const fullName = form.fullName.value.trim();
        const phone = form.phone.value.trim();
        const whatsapp = (form.whatsapp?.value || '').trim();
        const address = role === 'buyer' ? (form.address?.value || '').trim() : '';
        const email = (form.email?.value || '').trim();
        const password = form.password.value.trim();
        const storeName = role === 'merchant' ? (form.storeName?.value || '').trim() : '';

        if (fullName.split(/\s+/).filter(Boolean).length < 2) {
          state.authError = 'يرجى إدخال الاسم بالكامل (اسمين على الأقل).';
          SoundFX.error();
          render();
          return;
        }
        if (!/^01[0125][0-9]{8}$/.test(phone)) {
          state.authError = 'يرجى إدخال رقم هاتف مصري صحيح مكون من 11 رقماً.';
          SoundFX.error();
          render();
          return;
        }
        if (whatsapp && !/^01[0125][0-9]{8}$/.test(whatsapp)) {
          state.authError = 'رقم الواتساب غير صحيح (اتركه فارغاً أو أدخل 11 رقماً صحيحاً).';
          SoundFX.error();
          render();
          return;
        }
        if (role === 'buyer' && address.length < 6) {
          state.authError = 'يرجى إدخال العنوان بالتفصيل (المحافظة، المنطقة، الشارع).';
          SoundFX.error();
          render();
          return;
        }
        if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          state.authError = 'صيغة البريد الإلكتروني غير صحيحة (يمكنك تركه فارغاً لأنه اختياري).';
          SoundFX.error();
          render();
          return;
        }
        if (password.length < 4) {
          state.authError = 'كلمة المرور يجب ألا تقل عن 4 أحرف أو أرقام.';
          SoundFX.error();
          render();
          return;
        }

        const existing = state.users.find((u) => u.phone === phone && u.role === role);
        const userObj = {
          id: existing ? existing.id : 'usr-' + Date.now(),
          role,
          fullName,
          phone,
          whatsapp,
          address,
          email,
          password,
          storeName: storeName || 'متجر أناقة للأزياء'
        };

        if (existing) {
          state.users = state.users.map((u) => (u.id === existing.id ? userObj : u));
        } else {
          state.users.unshift(userObj);
        }

        if (role === 'merchant') {
          state.currentMerchant = userObj;
          state.view = 'admin';
        } else {
          state.currentBuyer = userObj;
        }

        state.modal = nextAction === 'checkout' && role === 'buyer' ? { type: 'checkout' } : null;
        state.authError = '';
        saveState();
        SoundFX.success();
        render();
        showToast(
          role === 'merchant'
            ? `أهلاً بك يا ${fullName}! تم تفعيل حساب صاحب المتجر.`
            : `تم إنشاء حسابك بنجاح يا ${fullName}! يمكنك الآن إتمام طلباتك.`
        );
        return;
      }

      // تسجيل الدخول
      const identifier = form.identifier.value.trim();
      const password = form.password.value.trim();

      const found = state.users.find(
        (u) =>
          u.role === role &&
          (u.phone === identifier ||
            (u.whatsapp && u.whatsapp === identifier) ||
            (u.email && u.email.toLowerCase() === identifier.toLowerCase())) &&
          u.password === password
      );

      if (!found) {
        state.authError = 'بيانات الدخول غير صحيحة. تأكد من الرقم/البريد وكلمة المرور أو أنشئ حساباً جديداً.';
        SoundFX.error();
        render();
        return;
      }

      if (role === 'merchant') {
        state.currentMerchant = found;
        state.view = 'admin';
      } else {
        state.currentBuyer = found;
      }

      state.modal = nextAction === 'checkout' && role === 'buyer' ? { type: 'checkout' } : null;
      state.authError = '';
      saveState();
      SoundFX.success();
      render();
      showToast(`مرحباً بعودتك، ${found.fullName}!`);
    };

    window.selectProductSize = function (productId, size) {
      SoundFX.click();
      state.selectedSizesMap[productId] = size;
      render();
    };

    window.addToCart = function (productId) {
      const product = state.products.find((p) => p.id === productId);
      if (!product) return;
      const chosenSize = state.selectedSizesMap[productId] || (product.sizes && product.sizes[0]) || 'M';

      const existing = state.cart.find((item) => item.productId === productId && item.size === chosenSize);
      if (existing) {
        existing.qty += 1;
      } else {
        state.cart.push({ productId, size: chosenSize, qty: 1 });
      }
      state.cartBounce = true;
      SoundFX.addToCart();
      saveState();
      render();
      setTimeout(() => {
        state.cartBounce = false;
      }, 500);
      showToast(`تمت إضافة «${product.name}» (مقاس ${chosenSize}) إلى السلة!`);
    };

    window.proceedToCheckout = function () {
      if (!state.cart.length) return;
      if (!state.currentBuyer) {
        SoundFX.error();
        state.modal = { type: 'auth', role: 'buyer', mode: 'login', nextAction: 'checkout' };
        state.authError = 'يجب تسجيل الدخول أو إنشاء حساب مشتري أولاً لإتمام عملية الشراء.';
        render();
        return;
      }
      SoundFX.click();
      state.modal = { type: 'checkout' };
      render();
    };

    window.updateCartQty = function (index, delta) {
      SoundFX.click();
      const item = state.cart[index];
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) {
        state.cart.splice(index, 1);
      }
      saveState();
      render();
    };

    window.handlePlaceOrder = function (event) {
      event.preventDefault();
      if (!state.cart.length) return;

      if (!state.currentBuyer) {
        state.modal = { type: 'auth', role: 'buyer', mode: 'login', nextAction: 'checkout' };
        state.authError = 'يرجى تسجيل الدخول بحساب المشتري أولاً لإتمام الطلب.';
        render();
        return;
      }

      const form = event.target;
      const customerName = form.customerName.value.trim();
      const customerPhone = form.customerPhone.value.trim();
      const customerWhatsapp = (form.customerWhatsapp?.value || '').trim();
      const address = form.address.value.trim();
      const notes = form.notes.value.trim();

      if (!customerName || !customerPhone || !address) {
        showToast('يرجى إدخال الاسم ورقم الهاتف وعنوان التوصيل بالتفصيل.', 'error');
        return;
      }

      const orderItems = state.cart
        .map((c) => {
          const prd = state.products.find((p) => p.id === c.productId);
          if (!prd) return null;
          const unitPrice = getEffectivePrice(prd);
          return {
            name: prd.name,
            size: c.size,
            qty: c.qty,
            unitPrice,
            subtotal: unitPrice * c.qty
          };
        })
        .filter(Boolean);

      const totalAmount = orderItems.reduce((sum, it) => sum + it.subtotal, 0);

      const newOrder = {
        id: 'ORD-' + Math.floor(10000 + Math.random() * 90000),
        customerName,
        customerPhone,
        customerWhatsapp,
        address,
        notes,
        items: orderItems,
        totalAmount,
        status: 'قيد التجهيز',
        createdAt: new Date().toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' })
      };

      state.orders.unshift(newOrder);
      state.cart = [];
      state.modal = null;
      saveState();
      SoundFX.success();
      render();
      showToast(`تم تأكيد طلبك رقم ${newOrder.id} بنجاح! سيصل فوراً لإدارة المتجر.`);
    };

    window.handleAddProduct = function (event) {
      event.preventDefault();
      if (!state.currentMerchant) {
        state.modal = { type: 'auth', role: 'merchant', mode: 'login' };
        state.authError = 'يجب تسجيل الدخول كصاحب متجر لإضافة أصناف جديدة.';
        render();
        return;
      }

      const form = event.target;
      const name = form.name.value.trim();
      const category = form.category.value;
      const price = Math.max(1, Number(form.price.value) || 0);
      const isOffer = form.isOffer.checked;
      const offerPriceRaw = Number(form.offerPrice.value) || 0;
      const offerLabel = form.offerLabel.value.trim();
      const sizesRaw = form.sizes.value.trim();
      const color = form.color.value.trim() || 'متعدد الألوان';
      const stock = Math.max(1, Number(form.stock.value) || 10);
      const imageUrlInput = form.imageUrl.value.trim();
      const description = form.description.value.trim();

      if (!name) return;

      if (isOffer && (offerPriceRaw <= 0 || offerPriceRaw >= price)) {
        showToast('يجب أن يكون سعر العرض أقل من السعر الأصلي وأكبر من صفر.', 'error');
        return;
      }

      const finalImage =
        state.uploadedImageDataUrl ||
        imageUrlInput ||
        'https://images.unsplash.com/photo-1523381210434-271e8be1f52b?auto=format&fit=crop&w=800&q=80';

      const sizes = sizesRaw
        ? sizesRaw.split(/[,،\s]+/).map((s) => s.trim()).filter(Boolean)
        : ['S', 'M', 'L', 'XL'];

      const newProduct = {
        id: 'prd-' + Date.now(),
        name,
        category,
        price,
        isOffer,
        offerPrice: isOffer ? offerPriceRaw : null,
        offerLabel: isOffer ? (offerLabel || 'عرض خاص') : '',
        sizes,
        color,
        stock,
        image: finalImage,
        description: description || 'موديل جديد متوفر الآن في المتجر بخامة عالية الجودة.'
      };

      state.products.unshift(newProduct);
      state.uploadedImageDataUrl = '';
      form.reset();
      saveState();
      render();
      showToast('تمت إضافة الصنف بنجاح! سيظهر الآن مباشرة في رابط المشتري.');
    };

    window.toggleOfferFieldsInForm = function (checkbox) {
      const box = document.getElementById('offer-fields-box');
      if (box) {
        box.classList.toggle('hidden', !checkbox.checked);
      }
    };

    window.handleApplyOfferToExisting = function (event) {
      event.preventDefault();
      if (!state.currentMerchant) return;

      const form = event.target;
      const productId = form.productId.value;
      const offerPrice = Number(form.offerPrice.value) || 0;
      const offerLabel = form.offerLabel.value.trim() || 'عرض خاص';

      const target = state.products.find((p) => p.id === productId);
      if (!target) return;

      if (offerPrice <= 0 || offerPrice >= target.price) {
        showToast(`سعر العرض يجب أن يكون أقل من السعر الأصلي (${target.price} ج.م).`, 'error');
        return;
      }

      state.products = state.products.map((p) =>
        p.id === productId ? { ...p, isOffer: true, offerPrice, offerLabel } : p
      );
      saveState();
      render();
      showToast(`تم تفعيل العرض على «${target.name}» بنجاح!`);
    };

    window.removeOfferFromProduct = function (productId) {
      state.products = state.products.map((p) =>
        p.id === productId ? { ...p, isOffer: false, offerPrice: null, offerLabel: '' } : p
      );
      saveState();
      render();
      showToast('تم إيقاف العرض وإعادة السعر الأصلي.', 'info');
    };

    window.deleteProduct = function (productId) {
      state.products = state.products.filter((p) => p.id !== productId);
      state.cart = state.cart.filter((c) => c.productId !== productId);
      saveState();
      render();
      showToast('تم حذف الصنف من المتجر.', 'info');

      state.orders = state.orders.map((o) => (o.id === orderId ? { ...o, status: newStatus } : o));

                  <label class="block text-xs font-extrabold text-slate-700 mb-1">السعر الأصلي (ج.م) <span class="text-rose-500">*</span></label>

                </div>
              </div>

              <!-- خيار تفعيل العرض مباشرة -->
              <div class="p-3.5 rounded-2xl bg-rose-50/70 border border-rose-200 space-y-3">
                <label class="flex items-center gap-2 text-xs font-black text-rose-800 cursor-pointer">
                  <input type="checkbox" name="isOffer" onchange="toggleOfferFieldsInForm(this)" class="w-4 h-4 accent-rose-600" />
                  <span>تفعيل عرض وتخفيض على هذا الصنف</span>
                </label>

                <div id="offer-fields-box" class="hidden grid grid-cols-2 gap-2.5 pt-1">
                  <div>
                    <label class="block text-[11px] font-bold text-rose-900 mb-1">سعر العرض (ج.م)</label>
                    <input type="number" name="offerPrice" min="1" placeholder="499" class="w-full px-3 py-2 rounded-xl bg-white border border-rose-200 text-xs" />
                  </div>
                  <div>
                    <label class="block text-[11px] font-bold text-rose-900 mb-1">عنوان شارة العرض</label>
                    <input type="text" name="offerLabel" placeholder="خصم 25%" class="w-full px-3 py-2 rounded-xl bg-white border border-rose-200 text-xs" />
                  </div>
                </div>
              </div>

              <!-- إضافة صورة للصنف (رفع من الجهاز أو رابط صورة) -->
              <div class="space-y-2">
                <label class="block text-xs font-extrabold text-slate-700">صورة الصنف (ارفع من جهازك أو ضع رابط صورة)</label>
                <input type="file" accept="image/*" onchange="handleImageFileUpload(event)" class="w-full text-xs text-slate-600 file:ml-3 file:py-2 file:px-3.5 file:rounded-xl file:border-0 file:text-xs file:font-extrabold file:bg-slate-900 file:text-white hover:file:bg-slate-800 cursor-pointer" />
                <input type="url" name="imageUrl" placeholder="أو الصق رابط الصورة https://..." dir="ltr" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-xs text-right" />
                <img id="new-product-img-preview" alt="معاينة الصورة" class="hidden w-full h-36 object-cover rounded-2xl border border-slate-200" />
              </div>

              <div class="grid grid-cols-3 gap-2.5">
                <div>
                  <label class="block text-[11px] font-bold text-slate-600 mb-1">المقاسات</label>

                </div>
                <div>
                  <label class="block text-[11px] font-bold text-slate-600 mb-1">اللون</label>
                  <input type="text" name="color" placeholder="أسود" class="w-full px-2.5 py-2 rounded-xl border border-slate-200 text-xs" />
                </div>
                <div>
                  <label class="block text-[11px] font-bold text-slate-600 mb-1">الكمية</label>
                  <input type="number" name="stock" value="15" min="1" class="w-full px-2.5 py-2 rounded-xl border border-slate-200 text-xs" />
                </div>
              </div>

              <div>
                <label class="block text-xs font-extrabold text-slate-700 mb-1">وصف الخامة والموديل</label>
                <textarea name="description" rows="2" placeholder="اكتب تفاصيل الخامة والقصّة..." class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-xs"></textarea>
              </div>

              <button type="submit" class="w-full py-3.5 rounded-2xl bg-slate-900 hover:bg-rose-600 text-white text-sm font-black transition-colors cursor-pointer">
                نشر الصنف في المتجر الآن
              </button>
            </form>

            <!-- قائمة الأصناف المنشورة حالياً -->
            <div class="lg:col-span-7 space-y-4">
              <div class="flex items-center justify-between">
                <h3 class="text-lg font-black text-slate-900">الأصناف المعروضة للمشترين (${state.products.length})</h3>

              <div class="space-y-3">
                ${state.products
                  .map((p) => {
                    const hasOffer = p.isOffer && p.offerPrice && p.offerPrice < p.price;
                    return `
                      <div class="bg-white p-4 rounded-2xl border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div class="flex items-center gap-3.5">
                          <img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}" onerror="this.src='https://placehold.co/200x200/0f172a/ffffff?text=Item'" class="w-16 h-16 rounded-xl object-cover border border-slate-200 shrink-0" />
                          <div>
                            <div class="flex flex-wrap items-center gap-1.5">
                              <span class="text-[11px] font-extrabold px-2 py-0.5 rounded-md bg-slate-100 text-slate-700">${escapeHtml(p.category)}</span>
                              ${hasOffer ? `<span class="text-[11px] font-black px-2 py-0.5 rounded-md bg-rose-100 text-rose-700">عرض نشط (-${getDiscountPercent(p)}%)</span>` : ''}
                            </div>
                            <h4 class="text-sm sm:text-base font-black text-slate-900 mt-1">${escapeHtml(p.name)}</h4>
                            <p class="text-xs text-slate-500 mt-0.5">
                              ${
                                hasOffer
                                  ? `<strong class="text-rose-600">${p.offerPrice} ج.م</strong> <span class="line-through text-slate-400">(${p.price} ج.م)</span>`
                                  : `<strong class="text-slate-900">${p.price} ج.م</strong>`
                              }
                              • المقاسات: ${escapeHtml((p.sizes || []).join(', '))}
                            </p>
                          </div>
                        </div>

                        <div class="flex items-center gap-2 self-end sm:self-center">
                          ${
                            hasOffer
                              ? `<button type="button" onclick="removeOfferFromProduct('${p.id}')" class="px-3 py-1.5 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-800 text-xs font-extrabold cursor-pointer">
                                  إلغاء العرض
                                </button>`
                              : ''
                          }
                          <button type="button" onclick="deleteProduct('${p.id}')" class="px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-extrabold cursor-pointer">
                            حذف
                          </button>
                        </div>
                      </div>
                    `;
                  })
                  .join('')}
              </div>
            </div>
          </div>
        `;
      }

      // تبويب 2: إدارة العروض والتخفيضات
      if (state.adminTab === 'offers') {
        tabHtml = `
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-7">
            <form onsubmit="handleApplyOfferToExisting(event)" class="lg:col-span-5 bg-white rounded-3xl border border-slate-200 p-6 shadow-xs space-y-4 h-fit">
              <h3 class="text-lg font-black text-slate-900">🔥 عمل عرض أو تخفيض على صنف</h3>
              <p class="text-xs text-slate-500">اختر أي قطعة ملابس وحدد سعر العرض الجديد ليظهر فوراً في قسم العروض عند المشتري.</p>

              <div>
                <label class="block text-xs font-extrabold text-slate-700 mb-1">اختر الصنف</label>
                <select name="productId" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm bg-white font-bold">
                  ${state.products
                    .map((p) => `<option value="${p.id}">${escapeHtml(p.name)} (السعر الأصلي: ${p.price} ج.م)</option>`)
                    .join('')}
                </select>
              </div>

              <div>
                <label class="block text-xs font-extrabold text-slate-700 mb-1">سعر العرض الجديد (ج.م) <span class="text-rose-500">*</span></label>
                <input type="number" name="offerPrice" min="1" required placeholder="أدخل السعر بعد الخصم" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm" />
              </div>

              <div>
                <label class="block text-xs font-extrabold text-slate-700 mb-1">نص شارة العرض</label>
                <input type="text" name="offerLabel" placeholder="مثال: عرض الجمعة البيضاء / خصم 30%" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm" />
              </div>

              <button type="submit" class="w-full py-3.5 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white text-sm font-black cursor-pointer">
                تفعيل العرض ونشره للمشترين
              </button>
            </form>

            <div class="lg:col-span-7 space-y-4">
              <h3 class="text-lg font-black text-slate-900">العروض النشطة حالياً (${activeOffers.length})</h3>
              ${
                activeOffers.length === 0
                  ? `<div class="bg-white rounded-3xl border border-slate-200 p-10 text-center text-sm text-slate-500">لا توجد عروض مفعّلة حالياً. استخدم النموذج لإضافة أول عرض!</div>`
                  : activeOffers
                      .map(
                        (p) => `
                    <div class="bg-white p-5 rounded-2xl border border-rose-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                      <div class="flex items-center gap-3.5">
                        <img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}" class="w-16 h-16 rounded-xl object-cover border border-slate-200" />
                        <div>
                          <span class="text-xs font-black px-2.5 py-0.5 rounded-full bg-rose-600 text-white">
                            خصم ${getDiscountPercent(p)}% • ${escapeHtml(p.offerLabel || 'عرض خاص')}
                          </span>
                          <h4 class="text-base font-black text-slate-900 mt-1">${escapeHtml(p.name)}</h4>
                          <p class="text-xs mt-0.5">
                            السعر بعد الخصم: <strong class="text-rose-600 text-sm">${p.offerPrice} ج.م</strong>
                            <span class="text-slate-400 line-through mr-1">بدلاً من ${p.price} ج.م</span>
                          </p>
                        </div>
                      </div>
                      <button type="button" onclick="removeOfferFromProduct('${p.id}')" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-extrabold cursor-pointer self-start sm:self-center">
                        إيقاف العرض
                      </button>
                    </div>
                  `
                      )
                      .join('')
              }
            </div>
          </div>
        `;
      }

      // تبويب 3: طلبات المشترين
      if (state.adminTab === 'orders') {
        tabHtml =
          state.orders.length === 0
            ? `<div class="bg-white rounded-3xl border border-slate-200 p-12 text-center space-y-2">
                <h3 class="text-lg font-black text-slate-900">لا توجد طلبات شراء واردة بعد</h3>
                <p class="text-xs text-slate-500">عندما يقوم أي مشتري بإتمام طلب من رابط المتجر سيظهر هنا بكل تفاصيله.</p>
              </div>`
            : `
            <div class="space-y-4">
              ${state.orders
                .map(
                  (ord) => `
                <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-2xs space-y-4">
                  <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-100">
                    <div>
                      <span class="font-mono text-xs font-black px-3 py-1 rounded-lg bg-slate-900 text-white">${escapeHtml(ord.id)}</span>
                      <span class="text-xs text-slate-500 mr-2">${escapeHtml(ord.createdAt)}</span>
                      <h4 class="text-base font-black text-slate-900 mt-2">
                        العميل: ${escapeHtml(ord.customerName)} • <span dir="ltr">${escapeHtml(ord.customerPhone)}</span>
                      </h4>
                      <p class="text-xs text-slate-600 mt-0.5">العنوان: ${escapeHtml(ord.address)}</p>
                    </div>

                    <div class="flex items-center gap-2">
                      <select onchange="updateOrderStatus('${ord.id}', this.value)" class="px-3.5 py-2 rounded-xl border border-slate-200 text-xs font-black bg-slate-50">
                        <option value="قيد التجهيز" ${ord.status === 'قيد التجهيز' ? 'selected' : ''}>قيد التجهيز</option>
                        <option value="خرج للشحن" ${ord.status === 'خرج للشحن' ? 'selected' : ''}>خرج للشحن</option>
                        <option value="تم التسليم" ${ord.status === 'تم التسليم' ? 'selected' : ''}>تم التسليم ✓</option>
                      </select>
                    </div>
                  </div>

                  <div class="space-y-1.5 text-xs">
                    ${ord.items
                      .map(
                        (it) => `
                      <div class="flex justify-between py-1.5 px-3 rounded-xl bg-slate-50 dark:bg-slate-800">
                        <span class="font-bold text-slate-800 dark:text-slate-200">${escapeHtml(it.name)} (مقاس ${escapeHtml(it.size)}) × ${it.qty}</span>
                        <span class="font-black text-slate-900 dark:text-white">${it.subtotal.toLocaleString('ar-EG')} ج.م</span>
                      </div>
                    `
                      )
                      .join('')}
                  </div>
                  ${ord.customerWhatsapp ? `<p class="text-xs text-emerald-700 dark:text-emerald-400 font-bold">واتساب العميل: <span dir="ltr">${escapeHtml(ord.customerWhatsapp)}</span></p>` : ''}

                  <div class="flex justify-between items-center pt-2 text-sm font-black">
                    <span>الإجمالي المطلوب تحصيله:</span>
                    <span class="text-rose-600 text-lg">${ord.totalAmount.toLocaleString('ar-EG')} ج.م</span>
                  </div>
                </div>
              `
                )
                .join('')}
            </div>
          `;
      }

      return `
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-16 space-y-8">
          <!-- رأس لوحة صاحب المتجر -->
          <section class="bg-slate-900 text-white rounded-3xl p-6 sm:p-8 shadow-xl flex flex-col lg:flex-row lg:items-center justify-between gap-5">
            <div class="space-y-1.5">
              <span class="inline-block px-3 py-1 rounded-full bg-rose-500/20 text-rose-300 border border-rose-400/30 text-xs font-black">
                لوحة تحكم صاحب المتجر (?view=admin)
              </span>
              <h1 class="text-2xl sm:text-3xl font-black">${escapeHtml(merchant.storeName || 'متجر أناقة للأزياء')}</h1>
              <p class="text-xs sm:text-sm text-slate-300">
                أهلاً بك يا <strong>${escapeHtml(merchant.fullName)}</strong> — أي صنف أو عرض تضيفه هنا يظهر فوراً في رابط المشتري.
              </p>
            </div>

            <div class="flex flex-wrap items-center gap-2.5">
              <button type="button" onclick="copyDirectLink('shop')" class="px-4 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-black cursor-pointer">
                نسخ رابط المشتري
              </button>
              <button type="button" onclick="copyDirectLink('admin')" class="px-4 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-white border border-white/15 text-xs font-extrabold cursor-pointer">
                نسخ رابط التاجر
              </button>
            </div>
          </section>

          <!-- إحصائيات سريعة -->
          <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-200">
              <span class="text-xs font-bold text-slate-500">إجمالي الأصناف</span>
              <p class="text-3xl font-black text-slate-900 mt-1">${state.products.length}</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200">
              <span class="text-xs font-bold text-slate-500">العروض النشطة</span>
              <p class="text-3xl font-black text-rose-600 mt-1">${activeOffers.length}</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200">
              <span class="text-xs font-bold text-slate-500">الطلبات الواردة</span>
              <p class="text-3xl font-black text-indigo-700 mt-1">${state.orders.length}</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200">
              <span class="text-xs font-bold text-slate-500">إجمالي المبيعات</span>
              <p class="text-3xl font-black text-emerald-700 mt-1">${totalRevenue.toLocaleString('ar-EG')} ج.م</p>
            </div>
          </section>

          <!-- تبويبات صاحب المتجر -->
          <nav class="flex flex-wrap gap-2 bg-white p-2 rounded-2xl border border-slate-200">
            <button type="button" onclick="setAdminTab('products')" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-black cursor-pointer ${
              state.adminTab === 'products' ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'
            }">
              الأصناف والصور (${state.products.length})
            </button>
            <button type="button" onclick="setAdminTab('offers')" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-black cursor-pointer ${
              state.adminTab === 'offers' ? 'bg-rose-600 text-white' : 'text-slate-600 hover:bg-slate-100'
            }">
              خانه العروض والتخفيضات (${activeOffers.length})
            </button>
            <button type="button" onclick="setAdminTab('orders')" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-black cursor-pointer ${
              state.adminTab === 'orders' ? 'bg-indigo-600 text-white' : 'text-slate-600 hover:bg-slate-100'
            }">
              طلبات المشترين (${state.orders.length})
            </button>
          </nav>

          <div>${tabHtml}</div>
        </div>
      `;
    }

    // =========================================================================
    // النوافذ المنبثقة (الحسابات، السلة، إتمام الطلب، الروابط المستقلة)
    // =========================================================================
    function renderModals() {
      if (!state.modal) return '';

      // 1) مودال إنشاء حساب / تسجيل دخول (مقيد بالدور الحالي: المشتري لا يرى خيار التاجر)
      if (state.modal.type === 'auth') {
        const role = state.view === 'admin' ? 'merchant' : 'buyer';
        const isReg = state.modal.mode === 'register';
        const isMerchant = role === 'merchant';

        return `
          <div class="fixed inset-0 z-50 bg-slate-950/65 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
            <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl max-w-md w-full p-6 sm:p-8 space-y-5 animate-fade-up">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <span class="text-xs font-black px-3 py-1 rounded-full ${isMerchant ? 'bg-rose-50 dark:bg-rose-950 text-rose-700 dark:text-rose-300' : 'bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300'}">
                    ${isMerchant ? 'بوابة صاحب المتجر' : 'حساب المشتري'}
                  </span>
                  <h2 class="text-xl font-black text-slate-900 dark:text-white mt-2">
                    ${isReg ? 'إنشاء حساب جديد' : 'تسجيل الدخول'}
                  </h2>
                </div>
                <button type="button" onclick="closeModal()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 cursor-pointer">✕</button>
              </div>

              <!-- تبديل بين تسجيل دخول وإنشاء حساب -->
              <div class="grid grid-cols-2 gap-1.5 bg-slate-100 dark:bg-slate-800 p-1 rounded-2xl text-xs font-black">
                <button type="button" onclick="openModal({ type: 'auth', role: '${role}', mode: 'login', nextAction: '${state.modal.nextAction || ''}' })" class="py-2 rounded-xl cursor-pointer ${
                  !isReg ? 'bg-slate-900 dark:bg-rose-600 text-white' : 'text-slate-600 dark:text-slate-300'
                }">
                  تسجيل الدخول
                </button>
                <button type="button" onclick="openModal({ type: 'auth', role: '${role}', mode: 'register', nextAction: '${state.modal.nextAction || ''}' })" class="py-2 rounded-xl cursor-pointer ${
                  isReg ? 'bg-slate-900 dark:bg-rose-600 text-white' : 'text-slate-600 dark:text-slate-300'
                }">
                  إنشاء حساب
                </button>
              </div>

              ${
                state.authError
                  ? `<div class="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/70 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-xs font-bold">${escapeHtml(state.authError)}</div>`
                  : ''
              }

              ${
                isReg
                  ? `
                <form onsubmit="handleAuthSubmit(event)" class="space-y-3">
                  <div>
                    <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">الاسم بالكامل <span class="text-rose-500">*</span></label>
                    <input type="text" name="fullName" required placeholder="مثال: كريم محمود علي" class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm" />
                  </div>
                  ${
                    isMerchant
                      ? `<div>
                          <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">اسم المتجر</label>
                          <input type="text" name="storeName" placeholder="متجر أناقة للأزياء" class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm" />
                        </div>`
                      : ''
                  }
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <div>
                      <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">رقم الهاتف <span class="text-rose-500">*</span></label>
                      <input type="tel" name="phone" required placeholder="01012345678" dir="ltr" class="w-full px-3.5 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm text-right" />
                    </div>
                    <div>
                      <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">رقم واتساب <span class="text-slate-400 font-semibold">(اختياري)</span></label>
                      <input type="tel" name="whatsapp" placeholder="01012345678" dir="ltr" class="w-full px-3.5 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm text-right" />
                    </div>
                  </div>
                  ${
                    !isMerchant
                      ? `<div>
                          <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">العنوان بالتفصيل <span class="text-rose-500">*</span></label>
                          <input type="text" name="address" required placeholder="المحافظة — المنطقة — اسم الشارع ورقم العقار" class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm" />
                        </div>`
                      : ''
                  }
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <div>
                      <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">البريد الإلكتروني <span class="text-slate-400 font-semibold">(اختياري)</span></label>
                      <input type="email" name="email" placeholder="user@example.com" dir="ltr" class="w-full px-3.5 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm text-right" />
                    </div>
                    <div>
                      <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">كلمة المرور <span class="text-rose-500">*</span></label>
                      <input type="password" name="password" required placeholder="••••••" class="w-full px-3.5 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm" />
                    </div>
                  </div>
                  <button type="submit" class="w-full py-3 rounded-2xl ${isMerchant ? 'bg-rose-600 hover:bg-rose-700' : 'bg-gradient-to-l from-rose-600 to-indigo-600 hover:opacity-95'} text-white text-sm font-black cursor-pointer">
                    إنشاء الحساب الآن
                  </button>
                </form>
              `
                  : `
                <form onsubmit="handleAuthSubmit(event)" class="space-y-3.5">
                  <div>
                    <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">رقم الهاتف أو البريد الإلكتروني</label>
                    <input type="text" name="identifier" required placeholder="01012345678" class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">كلمة المرور</label>
                    <input type="password" name="password" required placeholder="••••••" class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm" />
                  </div>
                  <button type="submit" class="w-full py-3 rounded-2xl ${isMerchant ? 'bg-rose-600 hover:bg-rose-700' : 'bg-gradient-to-l from-rose-600 to-indigo-600 hover:opacity-95'} text-white text-sm font-black cursor-pointer">
                    تسجيل الدخول
                  </button>
                </form>
              `
              }
            </div>
          </div>
        `;
      }

      // 2) مودال سلة المشتريات (يمنع الشراء بدون تسجيل دخول)
      if (state.modal.type === 'cart') {
        const detailedItems = state.cart
          .map((item, idx) => {
            const prd = state.products.find((p) => p.id === item.productId);
            if (!prd) return null;
            const unit = getEffectivePrice(prd);
            return { ...item, idx, product: prd, unit, total: unit * item.qty };
          })
          .filter(Boolean);

        const grandTotal = detailedItems.reduce((s, i) => s + i.total, 0);

        return `
          <div class="fixed inset-0 z-50 bg-slate-950/65 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl max-w-lg w-full p-6 sm:p-7 space-y-5 animate-fade-up">
              <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
                <h3 class="text-xl font-black text-slate-900 dark:text-white">🛒 سلة المشتريات (${detailedItems.length})</h3>
                <button type="button" onclick="closeModal()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 cursor-pointer">✕</button>
              </div>

              ${
                detailedItems.length === 0
                  ? `<p class="text-center text-sm text-slate-500 dark:text-slate-400 py-8">سلة المشتريات فارغة حالياً.</p>`
                  : `
                  <div class="space-y-3 max-h-72 overflow-y-auto">
                    ${detailedItems
                      .map(
                        (it) => `
                      <div class="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700 flex items-center justify-between gap-3">
                        <div class="flex items-center gap-3">
                          <img src="${escapeHtml(it.product.image)}" alt="" class="w-12 h-12 rounded-xl object-cover" />
                          <div>
                            <p class="text-xs sm:text-sm font-black text-slate-900 dark:text-white">${escapeHtml(it.product.name)}</p>
                            <p class="text-[11px] text-slate-500 dark:text-slate-400">المقاس: <strong>${escapeHtml(it.size)}</strong> • ${it.unit} ج.م</p>
                          </div>
                        </div>
                        <div class="flex items-center gap-2">
                          <button type="button" onclick="updateCartQty(${it.idx}, -1)" class="w-7 h-7 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 font-black cursor-pointer">-</button>
                          <span class="text-xs font-black w-5 text-center">${it.qty}</span>
                          <button type="button" onclick="updateCartQty(${it.idx}, 1)" class="w-7 h-7 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 font-black cursor-pointer">+</button>
                        </div>
                      </div>
                    `
                      )
                      .join('')}
                  </div>

                  <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                    <span class="text-sm font-bold text-slate-600 dark:text-slate-400">الإجمالي:</span>
                    <span class="text-2xl font-black text-slate-900 dark:text-white">${grandTotal.toLocaleString('ar-EG')} ج.م</span>
                  </div>

                  ${
                    !state.currentBuyer
                      ? `<p class="text-xs text-amber-800 dark:text-amber-300 bg-amber-50 dark:bg-amber-950/60 border border-amber-200 dark:border-amber-800 p-3 rounded-xl font-bold">
                          تنبيه: يجب تسجيل الدخول أو إنشاء حساب مشتري أولاً لتتمكن من إتمام عملية الشراء.
                        </p>`
                      : ''
                  }

                  <button type="button" onclick="proceedToCheckout()" class="w-full py-3.5 rounded-2xl bg-gradient-to-l from-rose-600 to-indigo-600 hover:opacity-95 text-white text-sm font-black cursor-pointer">
                    ${state.currentBuyer ? 'متابعة إتمام الطلب' : 'سجّل الدخول لإتمام الشراء'}
                  </button>
                `
              }
            </div>
          </div>
        `;
      }

      // 3) مودال إتمام الطلب (Checkout - يعبئ بيانات حساب المشتري تلقائياً)
      if (state.modal.type === 'checkout') {
        const b = state.currentBuyer;
        if (!b) return '';
        return `
          <div class="fixed inset-0 z-50 bg-slate-950/65 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl max-w-md w-full p-6 sm:p-7 space-y-4 animate-fade-up">
              <div class="flex items-center justify-between">
                <h3 class="text-xl font-black text-slate-900 dark:text-white">تأكيد بيانات التوصيل</h3>
                <button type="button" onclick="closeModal()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 cursor-pointer">✕</button>
              </div>
              <form onsubmit="handlePlaceOrder(event)" class="space-y-3.5">
                <div>
                  <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">اسم المستلم <span class="text-rose-500">*</span></label>
                  <input type="text" name="customerName" required value="${escapeHtml(b.fullName || '')}" placeholder="الاسم بالكامل" class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm" />
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                  <div>
                    <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">رقم الموبايل <span class="text-rose-500">*</span></label>
                    <input type="tel" name="customerPhone" required value="${escapeHtml(b.phone || '')}" placeholder="01012345678" dir="ltr" class="w-full px-3.5 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm text-right" />
                  </div>
                  <div>
                    <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">رقم واتساب (اختياري)</label>
                    <input type="tel" name="customerWhatsapp" value="${escapeHtml(b.whatsapp || '')}" placeholder="01012345678" dir="ltr" class="w-full px-3.5 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm text-right" />
                  </div>
                </div>
                <div>
                  <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">عنوان التوصيل بالتفصيل <span class="text-rose-500">*</span></label>
                  <input type="text" name="address" required value="${escapeHtml(b.address || '')}" placeholder="المحافظة — المنطقة — اسم الشارع ورقم العقار" class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">ملاحظات إضافية (اختياري)</label>
                  <input type="text" name="notes" placeholder="مثال: الاتصال قبل الوصول بنصف ساعة" class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm" />
                </div>
                <button type="submit" class="w-full py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-black cursor-pointer">
                  تأكيد وإرسال الطلب
                </button>
              </form>
            </div>
          </div>
        `;
      }

      // 4) مودال الروابط المستقلة (يظهر فقط داخل لوحة صاحب المتجر ?view=admin)
      if (state.modal.type === 'links' && state.view === 'admin') {
        const shopUrl = buildShareableLink('shop');
        const adminUrl = buildShareableLink('admin');
        return `
          <div class="fixed inset-0 z-50 bg-slate-950/65 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl max-w-xl w-full p-6 sm:p-8 space-y-5 animate-fade-up">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <span class="text-xs font-black px-3 py-1 rounded-full bg-amber-100 text-amber-900">مخصص لصاحب المتجر فقط</span>
                  <h3 class="text-xl font-black text-slate-900 dark:text-white mt-2">روابط المشتري وصاحب المتجر المستقلة</h3>
                </div>
                <button type="button" onclick="closeModal()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 cursor-pointer">✕</button>
              </div>

              <div class="space-y-3">
                <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 space-y-2">
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-black text-slate-900 dark:text-white">1. رابط متجر المشتري (أرسله للعملاء):</span>
                    <div class="flex gap-1.5">
                      <button type="button" onclick="copyDirectLink('shop')" class="px-3 py-1 rounded-lg bg-slate-900 text-white text-xs font-bold cursor-pointer">نسخ</button>
                      <button type="button" onclick="openNewWindowForView('shop')" class="px-3 py-1 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-bold cursor-pointer">فتح</button>
                    </div>
                  </div>
                  <code class="block text-[11px] text-slate-600 dark:text-slate-300 break-all bg-white dark:bg-slate-900 p-2 rounded-lg border border-slate-200 dark:border-slate-800" dir="ltr">${escapeHtml(shopUrl)}</code>
                </div>

                <div class="p-4 rounded-2xl bg-rose-50/60 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-900 space-y-2">
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-black text-rose-900 dark:text-rose-300">2. رابط لوحة صاحب المتجر (احتفظ به لنفسك):</span>
                    <div class="flex gap-1.5">
                      <button type="button" onclick="copyDirectLink('admin')" class="px-3 py-1 rounded-lg bg-rose-600 text-white text-xs font-bold cursor-pointer">نسخ</button>
                      <button type="button" onclick="openNewWindowForView('admin')" class="px-3 py-1 rounded-lg bg-white dark:bg-slate-800 border border-rose-200 dark:border-rose-800 text-rose-800 dark:text-rose-300 text-xs font-bold cursor-pointer">فتح</button>
                    </div>
                  </div>
                  <code class="block text-[11px] text-rose-900 dark:text-rose-200 break-all bg-white dark:bg-slate-900 p-2 rounded-lg border border-rose-200 dark:border-rose-900" dir="ltr">${escapeHtml(adminUrl)}</code>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      return '';
    }

    function render() {
      const root = document.getElementById('app');
      if (!root) return;

      const toastHtml = state.toast
        ? `
          <div class="fixed bottom-5 left-5 z-50 max-w-sm bg-slate-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl border border-slate-700 flex items-center gap-2.5 text-xs sm:text-sm font-bold animate-fade-up">
            <span class="w-2.5 h-2.5 rounded-full shrink-0 ${
              state.toast.tone === 'error' ? 'bg-rose-400' : state.toast.tone === 'info' ? 'bg-sky-400' : 'bg-emerald-400'
            }"></span>
            <span>${escapeHtml(state.toast.text)}</span>
          </div>
        `
        : '';

      root.innerHTML = `
        ${renderNavbar()}
        <main class="flex-1">
          ${state.view === 'admin' ? renderMerchantAdminView() : renderShopView()}
        </main>
        <footer class="glass-bar border-t border-slate-200 dark:border-slate-800 py-5 px-4 text-xs text-slate-500 dark:text-slate-400">
          <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
            <p class="font-bold text-slate-700 dark:text-slate-200">متجر أناقة للأزياء — جميع الحقوق محفوظة.</p>
            <p>${state.view === 'admin' ? 'وضع إدارة المتجر (?view=admin)' : 'تسوق آمن وتوصيل سريع لجميع المحافظات.'}</p>
          </div>
        </footer>
        ${renderModals()}
        ${toastHtml}
      `;
    }

    render();
  </script>
</body>
</html>
