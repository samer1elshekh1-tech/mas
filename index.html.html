              </div>

              <button type="submit" class="w-full py-3.5 rounded-2xl bg-slate-900 dark:bg-rose-600 hover:bg-rose-600 dark:hover:bg-rose-700 text-white text-sm font-black transition-colors cursor-pointer">
                نشر الصنف في المتجر الآن
              </button>
            </form>

            <!-- قائمة الأصناف المنشورة حالياً -->
            <div class="lg:col-span-7 space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <h3 class="text-lg font-black text-slate-900 dark:text-white">الأصناف المعروضة للمشترين (${state.products.length})</h3>
                <button type="button" onclick="switchView('shop')" class="text-xs font-black text-indigo-600 dark:text-indigo-400 hover:underline cursor-pointer">
                  معاينة واجهة المشتري الآن ←
                </button>
              </div>

              <div class="space-y-3">
                ${state.products
                  .map((p) => {
                    const hasOffer = p.isOffer && p.offerPrice && p.offerPrice < p.price;
                    return `
                      <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div class="flex items-center gap-3.5">
                          <img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}" onerror="this.src='https://placehold.co/200x200/0f172a/ffffff?text=Item'" class="w-16 h-16 rounded-xl object-cover border border-slate-200 dark:border-slate-700 shrink-0" />
                          <div>
                            <div class="flex flex-wrap items-center gap-1.5">
                              <span class="text-[11px] font-extrabold px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">${escapeHtml(p.category)}</span>
                              ${hasOffer ? `<span class="text-[11px] font-black px-2 py-0.5 rounded-md bg-rose-100 dark:bg-rose-950 text-rose-700 dark:text-rose-300">عرض نشط (-${getDiscountPercent(p)}%)</span>` : ''}
                              <span class="text-[11px] font-bold px-2 py-0.5 rounded-md ${Number(p.stock) > 0 ? 'bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300' : 'bg-rose-50 text-rose-700'}">
                                المخزون: ${p.stock}
                              </span>
                            </div>
                            <h4 class="text-sm sm:text-base font-black text-slate-900 dark:text-white mt-1">${escapeHtml(p.name)}</h4>
                            <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                              ${
                                hasOffer
                                  ? `<strong class="text-rose-600 dark:text-rose-400">${p.offerPrice} ج.م</strong> <span class="line-through text-slate-400">(${p.price} ج.م)</span>`
                                  : `<strong class="text-slate-900 dark:text-white">${p.price} ج.م</strong>`
                              }
                              • المقاسات: ${escapeHtml((p.sizes || []).join(', '))}
                            </p>
                          </div>
                        </div>

                        <div class="flex flex-wrap items-center gap-2 self-end sm:self-center">
                          <button type="button" onclick="restockProduct('${p.id}', 10)" class="px-3 py-1.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 text-xs font-extrabold cursor-pointer">
                            +10 مخزون
                          </button>
                          ${
                            hasOffer
                              ? `<button type="button" onclick="removeOfferFromProduct('${p.id}')" class="px-3 py-1.5 rounded-xl bg-amber-50 hover:bg-amber-100 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 text-xs font-extrabold cursor-pointer">
                                  إلغاء العرض
                                </button>`
                              : ''
                          }
                          <button type="button" onclick="deleteProduct('${p.id}')" class="px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 text-xs font-extrabold cursor-pointer">
                            حذف
                          </button>
                        </div>
                      </div>
                    `;
                  })
                  .join('')}
              </div>
            </div>
          </div>
        `;
      }

      // تبويب 2: إدارة العروض والتخفيضات
      if (state.adminTab === 'offers') {
        tabHtml = `
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-7">
            <form onsubmit="handleApplyOfferToExisting(event)" class="lg:col-span-5 bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-6 shadow-xs space-y-4 h-fit">
              <h3 class="text-lg font-black text-slate-900 dark:text-white">🔥 عمل عرض أو تخفيض على صنف</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400">اختر أي قطعة ملابس وحدد سعر العرض الجديد ليظهر فوراً في قسم العروض عند المشتري.</p>

              <div>
                <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">اختر الصنف</label>
                <select name="productId" class="w-full px-3.5 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm font-bold">
                  ${state.products
                    .map((p) => `<option value="${p.id}">${escapeHtml(p.name)} (السعر الأصلي: ${p.price} ج.م)</option>`)
                    .join('')}
                </select>
              </div>

              <div>
                <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">سعر العرض الجديد (ج.م) <span class="text-rose-500">*</span></label>
                <input type="number" name="offerPrice" min="1" required placeholder="أدخل السعر بعد الخصم" class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm" />
              </div>

              <div>
                <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">نص شارة العرض</label>
                <input type="text" name="offerLabel" placeholder="مثال: عرض الجمعة البيضاء / خصم 30%" class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm" />
              </div>

              <button type="submit" class="w-full py-3.5 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white text-sm font-black cursor-pointer">
                تفعيل العرض ونشره للمشترين
              </button>
            </form>

            <div class="lg:col-span-7 space-y-4">
              <h3 class="text-lg font-black text-slate-900 dark:text-white">العروض النشطة حالياً (${activeOffers.length})</h3>
              ${
                activeOffers.length === 0
                  ? `<div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-10 text-center text-sm text-slate-500 dark:text-slate-400">لا توجد عروض مفعّلة حالياً. استخدم النموذج لإضافة أول عرض!</div>`
                  : activeOffers
                      .map(
                        (p) => `
                    <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-rose-200 dark:border-rose-900 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                      <div class="flex items-center gap-3.5">
                        <img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}" class="w-16 h-16 rounded-xl object-cover border border-slate-200 dark:border-slate-700" />
                        <div>
                          <span class="text-xs font-black px-2.5 py-0.5 rounded-full bg-rose-600 text-white">
                            خصم ${getDiscountPercent(p)}% • ${escapeHtml(p.offerLabel || 'عرض خاص')}
                          </span>
                          <h4 class="text-base font-black text-slate-900 dark:text-white mt-1">${escapeHtml(p.name)}</h4>
                          <p class="text-xs text-slate-600 dark:text-slate-300 mt-0.5">
                            السعر بعد الخصم: <strong class="text-rose-600 dark:text-rose-400 text-sm">${p.offerPrice} ج.م</strong>
                            <span class="text-slate-400 line-through mr-1">بدلاً من ${p.price} ج.م</span>
                          </p>
                        </div>
                      </div>
                      <button type="button" onclick="removeOfferFromProduct('${p.id}')" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 text-xs font-extrabold cursor-pointer self-start sm:self-center">
                        إيقاف العرض
                      </button>
                    </div>
                  `
                      )
                      .join('')
              }
            </div>
          </div>
        `;
      }

      // تبويب 3: إدارة كوبونات الخصم
      if (state.adminTab === 'coupons') {
        tabHtml = `
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-7">
            <form onsubmit="handleAddCoupon(event)" class="lg:col-span-5 bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-6 shadow-xs space-y-4 h-fit">
              <h3 class="text-lg font-black text-slate-900 dark:text-white">🎟️ إنشاء كوبون خصم للمشترين</h3>
              <div>
                <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">كود الكوبون <span class="text-rose-500">*</span></label>
                <input type="text" name="code" required placeholder="مثال: VIP20" dir="ltr" class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm uppercase text-right" />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">نوع الخصم</label>
                  <select name="type" class="w-full px-3 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm font-bold">
                    <option value="percent">نسبة مئوية (%)</option>
                    <option value="fixed">مبلغ ثابت (ج.م)</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">قيمة الخصم <span class="text-rose-500">*</span></label>
                  <input type="number" name="value" min="1" required placeholder="15" class="w-full px-3 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm" />
                </div>
              </div>
              <div>
                <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">وصف الكوبون</label>
                <input type="text" name="label" placeholder="مثال: خصم 15% على كل الطلبات" class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm" />
              </div>
              <button type="submit" class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-black cursor-pointer">
                حفظ وتفعيل الكوبون
              </button>
            </form>

            <div class="lg:col-span-7 space-y-3">
              <h3 class="text-lg font-black text-slate-900 dark:text-white">كوبونات الخصم المتاحة (${state.coupons.length})</h3>
              ${state.coupons
                .map(
                  (cp) => `
                <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 flex items-center justify-between gap-3">
                  <div>
                    <div class="flex items-center gap-2">
                      <span class="font-mono text-sm font-black px-3 py-1 rounded-lg bg-amber-100 dark:bg-amber-950 text-amber-900 dark:text-amber-300">${escapeHtml(cp.code)}</span>
                      <span class="text-xs font-black px-2.5 py-0.5 rounded-full ${cp.active ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-600'}">
                        ${cp.active ? 'نشط' : 'متوقف'}
                      </span>
                    </div>
                    <p class="text-xs text-slate-600 dark:text-slate-300 mt-1">${escapeHtml(cp.label)}</p>
                  </div>
                  <button type="button" onclick="toggleCouponActive('${cp.id}')" class="px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 text-xs font-extrabold cursor-pointer">
                    ${cp.active ? 'إيقاف' : 'تفعيل'}
                  </button>
                </div>
              `
                )
                .join('')}
            </div>
          </div>
        `;
      }

      // تبويب 4: طلبات المشترين
      if (state.adminTab === 'orders') {
        tabHtml =
          state.orders.length === 0
            ? `<div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-12 text-center space-y-2">
                <h3 class="text-lg font-black text-slate-900 dark:text-white">لا توجد طلبات شراء واردة بعد</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400">عندما يقوم أي مشتري بإتمام طلب من المتجر سيظهر هنا بكل تفاصيله.</p>
              </div>`
            : `
            <div class="space-y-4">
              ${state.orders
                .map(
                  (ord) => `
                <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-6 shadow-2xs space-y-4">
                  <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-100 dark:border-slate-800">
                    <div>
                      <span class="font-mono text-xs font-black px-3 py-1 rounded-lg bg-slate-900 dark:bg-rose-600 text-white">${escapeHtml(ord.id)}</span>
                      <span class="text-xs text-slate-500 dark:text-slate-400 mr-2">${escapeHtml(ord.createdAt)}</span>
                      <h4 class="text-base font-black text-slate-900 dark:text-white mt-2">
                        العميل: ${escapeHtml(ord.customerName)} • <span dir="ltr">${escapeHtml(ord.customerPhone)}</span>
                      </h4>
                      <p class="text-xs text-slate-600 dark:text-slate-300 mt-0.5">العنوان: ${escapeHtml(ord.address)}</p>
                      <p class="text-xs text-indigo-700 dark:text-indigo-300 font-bold mt-0.5">طريقة الدفع: ${escapeHtml(ord.paymentMethod || 'الدفع عند الاستلام')}</p>
                    </div>

                    <div class="flex items-center gap-2">
                      <select onchange="updateOrderStatus('${ord.id}', this.value)" class="px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-black bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white">
                        <option value="قيد التجهيز" ${ord.status === 'قيد التجهيز' ? 'selected' : ''}>قيد التجهيز</option>
                        <option value="خرج للشحن" ${ord.status === 'خرج للشحن' ? 'selected' : ''}>خرج للشحن</option>
                        <option value="تم التسليم" ${ord.status === 'تم التسليم' ? 'selected' : ''}>تم التسليم ✓</option>
                      </select>
                    </div>
                  </div>

                  <div class="space-y-1.5 text-xs">
                    ${ord.items
                      .map(
                        (it) => `
                      <div class="flex justify-between py-1.5 px-3 rounded-xl bg-slate-50 dark:bg-slate-800">
                        <span class="font-bold text-slate-800 dark:text-slate-200">${escapeHtml(it.name)} (مقاس ${escapeHtml(it.size)}) × ${it.qty}</span>
                        <span class="font-black text-slate-900 dark:text-white">${it.subtotal.toLocaleString('ar-EG')} ج.م</span>
                      </div>
                    `
                      )
                      .join('')}
                  </div>
                  ${ord.customerWhatsapp ? `<p class="text-xs text-emerald-700 dark:text-emerald-400 font-bold">واتساب العميل: <span dir="ltr">${escapeHtml(ord.customerWhatsapp)}</span></p>` : ''}
                  ${ord.notes ? `<p class="text-xs text-slate-500 dark:text-slate-400">ملاحظات: ${escapeHtml(ord.notes)}</p>` : ''}
                  ${ord.couponCode ? `<p class="text-xs text-amber-700 dark:text-amber-300 font-bold">كوبون مستخدم: ${escapeHtml(ord.couponCode)} (خصم ${ord.discount} ج.م)</p>` : ''}

                  <div class="flex justify-between items-center pt-2 text-sm font-black text-slate-900 dark:text-white">
                    <span>الإجمالي المطلوب تحصيله:</span>
                    <span class="text-rose-600 dark:text-rose-400 text-lg">${ord.totalAmount.toLocaleString('ar-EG')} ج.م</span>
                  </div>
                </div>
              `
                )
                .join('')}
            </div>
          `;
      }

      return `
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-16 space-y-8 animate-fade-up">
          <!-- رأس لوحة صاحب المتجر -->
          <section class="bg-slate-900 text-white rounded-3xl p-6 sm:p-8 shadow-xl flex flex-col lg:flex-row lg:items-center justify-between gap-5">
            <div class="space-y-1.5">
              <span class="inline-block px-3 py-1 rounded-full bg-rose-500/20 text-rose-300 border border-rose-400/30 text-xs font-black">
                لوحة تحكم صاحب المتجر (?view=admin)
              </span>
              <h1 class="text-2xl sm:text-3xl font-black">${escapeHtml(merchant.storeName || 'متجر أناقة للأزياء')}</h1>
              <p class="text-xs sm:text-sm text-slate-300">
                أهلاً بك يا <strong>${escapeHtml(merchant.fullName)}</strong> — أي صنف أو عرض أو كوبون تضيفه هنا يظهر فوراً للمشترين.
              </p>
            </div>

            <div class="flex flex-wrap items-center gap-2.5">
              <button type="button" onclick="copyDirectLink('shop')" class="px-4 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-black cursor-pointer">
                نسخ رابط المشتري
              </button>
              <button type="button" onclick="copyDirectLink('admin')" class="px-4 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-white border border-white/15 text-xs font-extrabold cursor-pointer">
                نسخ رابط التاجر
              </button>
            </div>
          </section>

          <!-- إحصائيات سريعة -->
          <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800">
              <span class="text-xs font-bold text-slate-500 dark:text-slate-400">إجمالي الأصناف</span>
              <p class="text-3xl font-black text-slate-900 dark:text-white mt-1">${state.products.length}</p>
            </div>
            <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800">
              <span class="text-xs font-bold text-slate-500 dark:text-slate-400">العروض النشطة</span>
              <p class="text-3xl font-black text-rose-600 dark:text-rose-400 mt-1">${activeOffers.length}</p>
            </div>
            <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800">
              <span class="text-xs font-bold text-slate-500 dark:text-slate-400">الطلبات الواردة</span>
              <p class="text-3xl font-black text-indigo-700 dark:text-indigo-400 mt-1">${state.orders.length}</p>
            </div>
            <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800">
              <span class="text-xs font-bold text-slate-500 dark:text-slate-400">إجمالي المبيعات</span>
              <p class="text-3xl font-black text-emerald-700 dark:text-emerald-400 mt-1">${totalRevenue.toLocaleString('ar-EG')} ج.م</p>
            </div>
          </section>

          <!-- تبويبات صاحب المتجر -->
          <nav class="flex flex-wrap gap-2 bg-white dark:bg-slate-900 p-2 rounded-2xl border border-slate-200 dark:border-slate-800">
            <button type="button" onclick="setAdminTab('products')" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-black cursor-pointer ${
              state.adminTab === 'products' ? 'bg-slate-900 dark:bg-indigo-600 text-white' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
            }">
              الأصناف والصور (${state.products.length})
            </button>
            <button type="button" onclick="setAdminTab('offers')" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-black cursor-pointer ${
              state.adminTab === 'offers' ? 'bg-rose-600 text-white' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
            }">
              العروض والتخفيضات (${activeOffers.length})
            </button>
            <button type="button" onclick="setAdminTab('coupons')" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-black cursor-pointer ${
              state.adminTab === 'coupons' ? 'bg-amber-500 text-slate-950' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
            }">
              كوبونات الخصم (${state.coupons.length})
            </button>
            <button type="button" onclick="setAdminTab('orders')" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-black cursor-pointer ${
              state.adminTab === 'orders' ? 'bg-indigo-600 text-white' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
            }">
              طلبات المشترين (${state.orders.length})
            </button>
          </nav>

          <div>${tabHtml}</div>
        </div>
      `;
    }

    // =========================================================================
    // 10) النوافذ المنبثقة (Modals)
    // =========================================================================
    function renderModals() {
      if (!state.modal) return '';

      // 1) مودال معاينة تفاصيل الصنف السريعة
      if (state.modal.type === 'product-detail') {
        const p = state.products.find((item) => item.id === state.modal.productId);
        if (!p) return '';
        const hasOffer = p.isOffer && Number(p.offerPrice) > 0 && Number(p.offerPrice) < Number(p.price);
        const chosenSize = state.selectedSizesMap[p.id] || (p.sizes && p.sizes[0]) || 'M';
        const outOfStock = Number(p.stock) <= 0;

        return `
          <div class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
            <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl max-w-2xl w-full overflow-hidden animate-fade-up">
              <div class="grid grid-cols-1 md:grid-cols-2">
                <div class="relative h-72 md:h-auto bg-slate-100 dark:bg-slate-800">
                  <img
                    src="${escapeHtml(p.image)}"
                    alt="${escapeHtml(p.name)}"
                    onerror="this.src='https://placehold.co/600x600/0f172a/ffffff?text=Anaqa+Fashion'"
                    class="w-full h-full object-cover"
                  />
                  ${
                    hasOffer
                      ? `<span class="absolute top-3 right-3 px-3 py-1 rounded-full bg-rose-600 text-white text-xs font-black">
                          خصم ${getDiscountPercent(p)}%
                        </span>`
                      : ''
                  }
                </div>

                <div class="p-6 flex flex-col justify-between space-y-4">
                  <div class="space-y-3">
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-extrabold px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">
                        ${escapeHtml(p.category)}
                      </span>
                      <button type="button" onclick="closeModal()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 cursor-pointer">✕</button>
                    </div>

                    <h3 class="text-xl font-black text-slate-900 dark:text-white">${escapeHtml(p.name)}</h3>
                    <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 leading-relaxed">${escapeHtml(p.description || '')}</p>

                    <div class="text-xs text-slate-500 dark:text-slate-400 space-y-1">
                      <p>اللون المتاح: <strong class="text-slate-800 dark:text-slate-200">${escapeHtml(p.color || 'متعدد')}</strong></p>
                      <p>حالة المخزون: <strong class="${outOfStock ? 'text-rose-600' : 'text-emerald-600'}">${outOfStock ? 'نفدت الكمية' : `${p.stock} قطعة متاحة`}</strong></p>
                    </div>

                    <div>
                      <span class="text-xs font-extrabold text-slate-600 dark:text-slate-300 block mb-1.5">المقاس المختار:</span>
                      <div class="flex flex-wrap gap-1.5">
                        ${(p.sizes || ['M', 'L', 'XL'])
                          .map(
                            (sz) => `
                          <button
                            type="button"
                            onclick="selectProductSize('${p.id}', '${escapeHtml(sz)}')"
                            class="px-3 py-1.5 rounded-xl text-xs font-black border cursor-pointer ${
                              chosenSize === sz
                                ? 'bg-rose-600 text-white border-rose-600'
                                : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700'
                            }"
                          >
                            ${escapeHtml(sz)}
                          </button>
                        `
                          )
                          .join('')}
                      </div>
                    </div>
                  </div>

                  <div class="pt-3 border-t border-slate-100 dark:border-slate-800 space-y-3">
                    <div class="flex items-baseline gap-2">
                      ${
                        hasOffer
                          ? `<span class="text-2xl font-black text-rose-600">${p.offerPrice} ج.م</span>
                             <span class="text-xs text-slate-400 line-through">${p.price} ج.م</span>`
                          : `<span class="text-2xl font-black text-slate-900 dark:text-white">${p.price} ج.م</span>`
                      }
                    </div>

                    <button
                      type="button"
                      ${outOfStock ? 'disabled' : ''}
                      onclick="addToCart('${p.id}'); closeModal();"
                      class="w-full py-3 rounded-2xl text-xs sm:text-sm font-black ${
                        outOfStock
                          ? 'bg-slate-200 text-slate-400 cursor-not-allowed'
                          : 'bg-gradient-to-l from-rose-600 to-indigo-600 text-white cursor-pointer'
                      }"
                    >
                      ${outOfStock ? 'غير متوفر حالياً' : `+ أضف للسلة (مقاس ${escapeHtml(chosenSize)})`}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // 2) مودال إنشاء حساب / تسجيل الدخول
      if (state.modal.type === 'auth') {
        const role = state.view === 'admin' ? 'merchant' : 'buyer';
        const isReg = state.modal.mode === 'register';
        const isMerchant = role === 'merchant';

        return `
          <div class="fixed inset-0 z-50 bg-slate-950/65 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
            <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl max-w-md w-full p-6 sm:p-8 space-y-5 animate-fade-up">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <span class="text-xs font-black px-3 py-1 rounded-full ${isMerchant ? 'bg-rose-50 dark:bg-rose-950 text-rose-700 dark:text-rose-300' : 'bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300'}">
                    ${isMerchant ? 'بوابة صاحب المتجر' : 'حساب المشتري'}
                  </span>
                  <h2 class="text-xl font-black text-slate-900 dark:text-white mt-2">
                    ${isReg ? 'إنشاء حساب جديد' : 'تسجيل الدخول'}
                  </h2>
                </div>
                <button type="button" onclick="closeModal()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 cursor-pointer">✕</button>
              </div>

              <div class="grid grid-cols-2 gap-1.5 bg-slate-100 dark:bg-slate-800 p-1 rounded-2xl text-xs font-black">
                <button type="button" onclick="openModal({ type: 'auth', role: '${role}', mode: 'login', nextAction: '${state.modal.nextAction || ''}' })" class="py-2 rounded-xl cursor-pointer ${
                  !isReg ? 'bg-slate-900 dark:bg-rose-600 text-white' : 'text-slate-600 dark:text-slate-300'
                }">
                  تسجيل الدخول
                </button>
                <button type="button" onclick="openModal({ type: 'auth', role: '${role}', mode: 'register', nextAction: '${state.modal.nextAction || ''}' })" class="py-2 rounded-xl cursor-pointer ${
                  isReg ? 'bg-slate-900 dark:bg-rose-600 text-white' : 'text-slate-600 dark:text-slate-300'
                }">
                  إنشاء حساب
                </button>
              </div>

              ${
                state.authError
                  ? `<div class="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/70 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-xs font-bold">${escapeHtml(state.authError)}</div>`
                  : ''
              }

              ${
                isReg
                  ? `
                <form onsubmit="handleAuthSubmit(event)" class="space-y-3">
                  <div>
                    <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">الاسم بالكامل <span class="text-rose-500">*</span></label>
                    <input type="text" name="fullName" required placeholder="مثال: كريم محمود علي" class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm" />
                  </div>
                  ${
                    isMerchant
                      ? `<div>
                          <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">اسم المتجر</label>
                          <input type="text" name="storeName" placeholder="متجر أناقة للأزياء" class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm" />
                        </div>`
                      : ''
                  }
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <div>
                      <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">رقم الهاتف <span class="text-rose-500">*</span></label>
                      <input type="tel" name="phone" required placeholder="01012345678" dir="ltr" class="w-full px-3.5 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm text-right" />
                    </div>
                    <div>
                      <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">رقم واتساب <span class="text-slate-400 font-semibold">(اختياري)</span></label>
                      <input type="tel" name="whatsapp" placeholder="01012345678" dir="ltr" class="w-full px-3.5 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm text-right" />
                    </div>
                  </div>
                  ${
                    !isMerchant
                      ? `<div>
                          <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">العنوان بالتفصيل <span class="text-rose-500">*</span></label>
                          <input type="text" name="address" required placeholder="المحافظة — المنطقة — اسم الشارع ورقم العقار" class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm" />
                        </div>`
                      : ''
                  }
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <div>
                      <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">البريد الإلكتروني <span class="text-slate-400 font-semibold">(اختياري)</span></label>
                      <input type="email" name="email" placeholder="user@example.com" dir="ltr" class="w-full px-3.5 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm text-right" />
                    </div>
                    <div>
                      <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">كلمة المرور <span class="text-rose-500">*</span></label>
                      <input type="password" name="password" required placeholder="••••••" class="w-full px-3.5 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm" />
                    </div>
                  </div>
                  <button type="submit" class="w-full py-3 rounded-2xl ${isMerchant ? 'bg-rose-600 hover:bg-rose-700' : 'bg-gradient-to-l from-rose-600 to-indigo-600 hover:opacity-95'} text-white text-sm font-black cursor-pointer">
                    إنشاء الحساب الآن
                  </button>
                </form>
              `
                  : `
                <form onsubmit="handleAuthSubmit(event)" class="space-y-3.5">
                  <div>
                    <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">رقم الهاتف أو البريد الإلكتروني</label>
                    <input type="text" name="identifier" required placeholder="01012345678" class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">كلمة المرور</label>
                    <input type="password" name="password" required placeholder="••••••" class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm" />
                  </div>
                  <button type="submit" class="w-full py-3 rounded-2xl ${isMerchant ? 'bg-rose-600 hover:bg-rose-700' : 'bg-gradient-to-l from-rose-600 to-indigo-600 hover:opacity-95'} text-white text-sm font-black cursor-pointer">
                    تسجيل الدخول
                  </button>
                </form>
              `
              }
            </div>
          </div>
        `;
      }

      // 3) مودال سلة المشتريات + كوبونات الخصم
      if (state.modal.type === 'cart') {
        const { detailedItems, subtotal, discount, grandTotal, activeCoupon } = calculateCartTotals();

        return `
          <div class="fixed inset-0 z-50 bg-slate-950/65 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
            <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl max-w-lg w-full p-6 sm:p-7 space-y-5 animate-fade-up">
              <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
                <h3 class="text-xl font-black text-slate-900 dark:text-white">🛒 سلة المشتريات (${detailedItems.length})</h3>
                <button type="button" onclick="closeModal()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 cursor-pointer">✕</button>
              </div>

              ${
                detailedItems.length === 0
                  ? `<p class="text-center text-sm text-slate-500 dark:text-slate-400 py-8">سلة المشتريات فارغة حالياً.</p>`
                  : `
                  <div class="space-y-3 max-h-60 overflow-y-auto">
                    ${detailedItems
                      .map(
                        (it) => `
                      <div class="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700 flex items-center justify-between gap-3">
                        <div class="flex items-center gap-3">
                          <img src="${escapeHtml(it.product.image)}" alt="" class="w-12 h-12 rounded-xl object-cover" />
                          <div>
                            <p class="text-xs sm:text-sm font-black text-slate-900 dark:text-white">${escapeHtml(it.product.name)}</p>
                            <p class="text-[11px] text-slate-500 dark:text-slate-400">المقاس: <strong>${escapeHtml(it.size)}</strong> • ${it.unit} ج.م</p>
                          </div>
                        </div>
                        <div class="flex items-center gap-2">
                          <button type="button" onclick="updateCartQty(${it.idx}, -1)" class="w-7 h-7 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 font-black cursor-pointer">-</button>
                          <span class="text-xs font-black w-5 text-center">${it.qty}</span>
                          <button type="button" onclick="updateCartQty(${it.idx}, 1)" class="w-7 h-7 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 font-black cursor-pointer">+</button>
                        </div>
                      </div>
                    `
                      )
                      .join('')}
                  </div>

                  <!-- إدخال كوبون خصم -->
                  <div class="pt-2 border-t border-slate-100 dark:border-slate-800">
                    ${
                      activeCoupon
                        ? `<div class="flex items-center justify-between p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800 text-xs">
                            <span class="font-black text-emerald-800 dark:text-emerald-300">🎟️ كوبون ${escapeHtml(activeCoupon.code)} مفعّل (-${discount} ج.م)</span>
                            <button type="button" onclick="removeCartCoupon()" class="text-rose-600 font-extrabold cursor-pointer">إزالة</button>
                          </div>`
                        : `<form onsubmit="applyCartCoupon(event)" class="flex gap-2">
                            <input type="text" name="couponCode" placeholder="كود الخصم (جرّب ANAQA10)" class="flex-1 px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-xs font-bold uppercase" />
                            <button type="submit" class="px-4 py-2 rounded-xl bg-slate-900 dark:bg-indigo-600 text-white text-xs font-black cursor-pointer">تطبيق</button>
                          </form>`
                    }
                  </div>

                  <div class="space-y-1 pt-2 border-t border-slate-100 dark:border-slate-800 text-xs">
                    <div class="flex justify-between text-slate-500 dark:text-slate-400">
                      <span>المجموع الفرعي:</span>
                      <span>${subtotal.toLocaleString('ar-EG')} ج.م</span>
                    </div>
                    ${
                      discount > 0
                        ? `<div class="flex justify-between text-emerald-600 font-bold">
                            <span>الخصم:</span>
                            <span>-${discount.toLocaleString('ar-EG')} ج.م</span>
                          </div>`
                        : ''
                    }
                    <div class="flex items-center justify-between pt-1">
                      <span class="text-sm font-bold text-slate-700 dark:text-slate-300">الإجمالي النهائي:</span>
                      <span class="text-2xl font-black text-slate-900 dark:text-white">${grandTotal.toLocaleString('ar-EG')} ج.م</span>
                    </div>
                  </div>

                  ${
                    !state.currentBuyer
                      ? `<p class="text-xs text-amber-800 dark:text-amber-300 bg-amber-50 dark:bg-amber-950/60 border border-amber-200 dark:border-amber-800 p-3 rounded-xl font-bold">
                          تنبيه: يجب تسجيل الدخول أو إنشاء حساب مشتري أولاً لتتمكن من إتمام عملية الشراء.
                        </p>`
                      : ''
                  }

                  <button type="button" onclick="proceedToCheckout()" class="w-full py-3.5 rounded-2xl bg-gradient-to-l from-rose-600 to-indigo-600 hover:opacity-95 text-white text-sm font-black cursor-pointer">
                    ${state.currentBuyer ? 'متابعة إتمام الطلب' : 'سجّل الدخول لإتمام الشراء'}
                  </button>
                `
              }
            </div>
          </div>
        `;
      }

      // 4) مودال إتمام الطلب (Checkout)
      if (state.modal.type === 'checkout') {
        const b = state.currentBuyer;
        if (!b) return '';
        const { grandTotal } = calculateCartTotals();

        return `
          <div class="fixed inset-0 z-50 bg-slate-950/65 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
            <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl max-w-md w-full p-6 sm:p-7 space-y-4 animate-fade-up">
              <div class="flex items-center justify-between">
                <h3 class="text-xl font-black text-slate-900 dark:text-white">تأكيد بيانات التوصيل</h3>
                <button type="button" onclick="closeModal()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 cursor-pointer">✕</button>
              </div>
              <form onsubmit="handlePlaceOrder(event)" class="space-y-3.5">
                <div>
                  <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">اسم المستلم <span class="text-rose-500">*</span></label>
                  <input type="text" name="customerName" required value="${escapeHtml(b.fullName || '')}" placeholder="الاسم بالكامل" class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm" />
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                  <div>
                    <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">رقم الموبايل <span class="text-rose-500">*</span></label>
                    <input type="tel" name="customerPhone" required value="${escapeHtml(b.phone || '')}" placeholder="01012345678" dir="ltr" class="w-full px-3.5 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm text-right" />
                  </div>
                  <div>
                    <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">رقم واتساب (اختياري)</label>
                    <input type="tel" name="customerWhatsapp" value="${escapeHtml(b.whatsapp || '')}" placeholder="01012345678" dir="ltr" class="w-full px-3.5 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm text-right" />
                  </div>
                </div>
                <div>
                  <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">عنوان التوصيل بالتفصيل <span class="text-rose-500">*</span></label>
                  <input type="text" name="address" required value="${escapeHtml(b.address || '')}" placeholder="المحافظة — المنطقة — اسم الشارع ورقم العقار" class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">طريقة الدفع</label>
                  <select name="paymentMethod" class="w-full px-3.5 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm font-bold">
                    <option value="الدفع عند الاستلام (كاش)">الدفع عند الاستلام (كاش)</option>
                    <option value="فودافون كاش / إنستاباي">فودافون كاش / إنستاباي</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1">ملاحظات إضافية (اختياري)</label>
                  <input type="text" name="notes" placeholder="مثال: الاتصال قبل الوصول بنصف ساعة" class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm" />
                </div>
                <button type="submit" class="w-full py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-black cursor-pointer">
                  تأكيد وإرسال الطلب (${grandTotal.toLocaleString('ar-EG')} ج.م)
                </button>
              </form>
            </div>
          </div>
        `;
      }

      // 5) مودال متابعة طلبات المشتري
      if (state.modal.type === 'my-orders' && state.currentBuyer) {
        const myOrders = state.orders.filter(
          (o) =>
            o.buyerId === state.currentBuyer.id || o.customerPhone === state.currentBuyer.phone
        );
        return `
          <div class="fixed inset-0 z-50 bg-slate-950/65 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
            <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl max-w-xl w-full p-6 sm:p-7 space-y-5 animate-fade-up">
              <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
                <h3 class="text-xl font-black text-slate-900 dark:text-white">📦 سجل طلباتي (${myOrders.length})</h3>
                <button type="button" onclick="closeModal()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 cursor-pointer">✕</button>
              </div>
              ${
                myOrders.length === 0
                  ? `<p class="text-center text-sm text-slate-500 dark:text-slate-400 py-8">لم تقم بأي طلبات شراء بعد.</p>`
                  : `<div class="space-y-3 max-h-80 overflow-y-auto">
                      ${myOrders
                        .map(
                          (ord) => `
                        <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 space-y-2">
                          <div class="flex items-center justify-between">
                            <span class="font-mono text-xs font-black px-2.5 py-1 rounded-lg bg-slate-900 text-white">${escapeHtml(ord.id)}</span>
                            <span class="text-xs font-black px-3 py-1 rounded-full ${
                              ord.status === 'تم التسليم'
                                ? 'bg-emerald-100 text-emerald-800'
                                : ord.status === 'خرج للشحن'
                                ? 'bg-indigo-100 text-indigo-800'
                                : 'bg-amber-100 text-amber-800'
                            }">
                              ${escapeHtml(ord.status)}
                            </span>
                          </div>
                          <p class="text-[11px] text-slate-500 dark:text-slate-400">${escapeHtml(ord.createdAt)} • ${escapeHtml(ord.paymentMethod || '')}</p>
                          <div class="text-xs space-y-1">
                            ${ord.items.map((it) => `<div>• ${escapeHtml(it.name)} (${escapeHtml(it.size)}) × ${it.qty}</div>`).join('')}
                          </div>
                          <div class="flex justify-between pt-2 border-t border-slate-200 dark:border-slate-700 text-xs font-black">
                            <span>الإجمالي:</span>
                            <span class="text-rose-600 dark:text-rose-400">${ord.totalAmount.toLocaleString('ar-EG')} ج.م</span>
                          </div>
                        </div>
                      `
                        )
                        .join('')}
                    </div>`
              }
            </div>
          </div>
        `;
      }

      // 6) مودال الروابط المستقلة للتاجر
      if (state.modal.type === 'links' && state.view === 'admin') {
        const shopUrl = buildShareableLink('shop');
        const adminUrl = buildShareableLink('admin');
        return `
          <div class="fixed inset-0 z-50 bg-slate-950/65 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl max-w-xl w-full p-6 sm:p-8 space-y-5 animate-fade-up">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <span class="text-xs font-black px-3 py-1 rounded-full bg-amber-100 text-amber-900">مخصص لصاحب المتجر فقط</span>
                  <h3 class="text-xl font-black text-slate-900 dark:text-white mt-2">روابط المشتري وصاحب المتجر المستقلة</h3>
                </div>
                <button type="button" onclick="closeModal()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 cursor-pointer">✕</button>
              </div>

              <div class="space-y-3">
                <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 space-y-2">
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-black text-slate-900 dark:text-white">1. رابط متجر المشتري (أرسله للعملاء):</span>
                    <div class="flex gap-1.5">
                      <button type="button" onclick="copyDirectLink('shop')" class="px-3 py-1 rounded-lg bg-slate-900 text-white text-xs font-bold cursor-pointer">نسخ</button>
                      <button type="button" onclick="openNewWindowForView('shop')" class="px-3 py-1 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-bold cursor-pointer">فتح</button>
                    </div>
                  </div>
                  <code class="block text-[11px] text-slate-600 dark:text-slate-300 break-all bg-white dark:bg-slate-900 p-2 rounded-lg border border-slate-200 dark:border-slate-800" dir="ltr">${escapeHtml(shopUrl)}</code>
                </div>

                <div class="p-4 rounded-2xl bg-rose-50/60 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-900 space-y-2">
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-black text-rose-900 dark:text-rose-300">2. رابط لوحة صاحب المتجر (احتفظ به لنفسك):</span>
                    <div class="flex gap-1.5">
                      <button type="button" onclick="copyDirectLink('admin')" class="px-3 py-1 rounded-lg bg-rose-600 text-white text-xs font-bold cursor-pointer">نسخ</button>
                      <button type="button" onclick="openNewWindowForView('admin')" class="px-3 py-1 rounded-lg bg-white dark:bg-slate-800 border border-rose-200 dark:border-rose-800 text-rose-800 dark:text-rose-300 text-xs font-bold cursor-pointer">فتح</button>
                    </div>
                  </div>
                  <code class="block text-[11px] text-rose-900 dark:text-rose-200 break-all bg-white dark:bg-slate-900 p-2 rounded-lg border border-rose-200 dark:border-rose-900" dir="ltr">${escapeHtml(adminUrl)}</code>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      return '';
    }

    // =========================================================================
    // 11) دالة التصيير الرئيسية (Main Render)
    // =========================================================================
    function render() {
      const root = document.getElementById('app');
      if (!root) return;

      const toastHtml = state.toast
        ? `
          <div class="fixed bottom-5 left-5 z-50 max-w-sm bg-slate-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl border border-slate-700 flex items-center gap-2.5 text-xs sm:text-sm font-bold animate-fade-up">
            <span class="w-2.5 h-2.5 rounded-full shrink-0 ${
              state.toast.tone === 'error' ? 'bg-rose-400' : state.toast.tone === 'info' ? 'bg-sky-400' : 'bg-emerald-400'
            }"></span>
            <span>${escapeHtml(state.toast.text)}</span>
          </div>
        `
        : '';

      root.innerHTML = `
        ${renderNavbar()}
        <main class="flex-1">
          ${state.view === 'admin' ? renderMerchantAdminView() : renderShopView()}
        </main>
        <footer class="glass-bar border-t border-slate-200 dark:border-slate-800 py-5 px-4 text-xs text-slate-500 dark:text-slate-400">
          <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
            <p class="font-bold text-slate-700 dark:text-slate-200">متجر أناقة للأزياء — جميع الحقوق محفوظة.</p>
            <div class="flex items-center gap-4">
              <span>${state.view === 'admin' ? 'وضع إدارة المتجر (?view=admin)' : 'تسوق آمن وتوصيل سريع لجميع المحافظات.'}</span>
              <button
                type="button"
                onclick="switchView('${state.view === 'admin' ? 'shop' : 'admin'}')"
                class="font-extrabold text-slate-600 dark:text-slate-300 hover:text-rose-600 underline cursor-pointer"
              >
                ${state.view === 'admin' ? 'العودة لواجهة المتجر' : 'بوابة إدارة المتجر'}
              </button>
            </div>
          </div>
        </footer>
        ${renderModals()}
        ${toastHtml}
      `;
    }

    render();
  </script>
</body>
</html>
